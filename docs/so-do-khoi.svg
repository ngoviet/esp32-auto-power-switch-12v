<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="sdk-title sdk-desc">
  <title id="sdk-title">Sơ đồ khối bộ chuyển nguồn 12V</title>
  <desc id="sdk-desc">JK BMS gửi SOC lên Home Assistant, ESP32 nhận SOC qua Wi-Fi, điều khiển module MOSFET D4184 đóng cuộn hút relay SPDT để chọn nguồn Pin hoặc Adaptor cho tải 12V. ESP32 được nuôi từ cả hai nguồn qua hai diode Schottky và mạch hạ áp 5V.</desc>
  <defs>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
    <marker id="ah-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker>
    <marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    <marker id="ah-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb7185"/></marker>
    <style>
      .bg { fill: #0e1726; }
      .card { fill: #162238; stroke: #2d4466; stroke-width: 2; }
      .card-hot { fill: #1d2433; stroke: #f59e0b; stroke-width: 2.5; }
      .card-chip { fill: #14263a; stroke: #38bdf8; stroke-width: 2.5; }
      .h { font: 600 19px "Segoe UI", system-ui, sans-serif; fill: #e8eef8; }
      .s { font: 14px "Segoe UI", system-ui, sans-serif; fill: #9db0cf; }
      .t { font: 700 26px "Segoe UI", system-ui, sans-serif; fill: #f1f5fb; letter-spacing: .5px; }
      .st { font: 15px "Segoe UI", system-ui, sans-serif; fill: #9db0cf; }
      .sec { font: 700 12px "Segoe UI", system-ui, sans-serif; fill: #6f86ad; letter-spacing: 2px; }
      .lbl { font: 600 13px "Segoe UI", system-ui, sans-serif; fill: #c7d2e5; }
      .lg { font: 13px "Segoe UI", system-ui, sans-serif; fill: #c7d2e5; }
      .mono { font: 600 13px Consolas, "Cascadia Mono", monospace; fill: #e8eef8; }
      .note { font: 13.5px "Segoe UI", system-ui, sans-serif; fill: #9db0cf; }
      .p12 { stroke: #f59e0b; stroke-width: 6; fill: none; stroke-linejoin: round; }
      .p12t { stroke: #f59e0b; stroke-width: 3; fill: none; stroke-linejoin: round; }
      .sig { stroke: #38bdf8; stroke-width: 3; fill: none; }
      .data { stroke: #a78bfa; stroke-width: 3; fill: none; }
      .p5 { stroke: #34d399; stroke-width: 3.5; fill: none; stroke-linejoin: round; }
      .coil { stroke: #fb7185; stroke-width: 3; fill: none; stroke-dasharray: 9 6; stroke-linejoin: round; }
      .arm { stroke: #f1f5fb; stroke-width: 4; stroke-linecap: round; }
      .arm-alt { stroke: #6f86ad; stroke-width: 2.5; stroke-dasharray: 6 5; stroke-linecap: round; }
      .dot { fill: #f1f5fb; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760" rx="18"/>

  <!-- Tiêu đề -->
  <text class="t" x="40" y="50">SƠ ĐỒ KHỐI · CHUYỂN NGUỒN 12V</text>
  <text class="st" x="40" y="76">ESP32 + ESPHome · relay SPDT · SOC lấy từ Home Assistant</text>

  <!-- Chú giải -->
  <g id="legend">
    <title>Chú giải màu đường nối</title>
    <line class="p12" x1="640" y1="36" x2="676" y2="36"/><text class="lg" x="684" y="41">12V công suất</text>
    <line class="sig" x1="820" y1="36" x2="856" y2="36"/><text class="lg" x="864" y="41">tín hiệu điều khiển</text>
    <line class="data" x1="1010" y1="36" x2="1046" y2="36"/><text class="lg" x="1054" y="41">dữ liệu</text>
    <line class="p5" x1="640" y1="64" x2="676" y2="64"/><text class="lg" x="684" y="69">5V nuôi ESP32</text>
    <line class="coil" x1="820" y1="64" x2="856" y2="64"/><text class="lg" x="864" y="69">nguồn cuộn hút (từ Adaptor)</text>
  </g>

  <!-- Nhãn vùng -->
  <text class="sec" x="40" y="102">DỮ LIỆU</text>
  <text class="sec" x="40" y="290">NUÔI ESP32 · ĐIỀU KHIỂN</text>
  <text class="sec" x="40" y="432">CÔNG SUẤT 12V</text>

  <!-- Hàng 1: dữ liệu -->
  <g id="blk-jk">
    <title>JK BMS của bộ pin 24V 280Ah, đo SOC</title>
    <rect class="card" x="40" y="110" width="200" height="70" rx="12"/>
    <text class="h" x="56" y="140">JK BMS 24V 280Ah</text>
    <text class="s" x="56" y="164">đo SOC của pin</text>
  </g>
  <g id="blk-ha">
    <title>Home Assistant: giữ SOC, hiển thị và chỉnh chế độ, ngưỡng</title>
    <rect class="card" x="330" y="110" width="240" height="70" rx="12"/>
    <text class="h" x="346" y="140">Home Assistant</text>
    <text class="s" x="346" y="164">SOC % · bảng điều khiển</text>
  </g>
  <g id="blk-esp">
    <title>ESP32 DevKit chạy ESPHome, quyết định dùng Pin hay Adaptor</title>
    <rect class="card-chip" x="720" y="96" width="300" height="156" rx="14"/>
    <text class="h" x="738" y="128">ESP32 DevKit</text>
    <text class="s" x="738" y="154">ESPHome · esp-idf</text>
    <text class="s" x="738" y="178">Auto · Force Pin · Force Adaptor</text>
    <text class="s" x="738" y="202">Ngưỡng 50% / 70% · cách ≥ 60 s</text>
    <text class="s" x="738" y="226">Mất SOC &gt; 10 phút → tuỳ chọn</text>
  </g>
  <g id="edge-jk-ha">
    <title>SOC đi từ BMS lên Home Assistant (repo esp32_doc_pin_24v)</title>
    <path class="data" d="M240 145H322" marker-end="url(#ah-violet)"/>
    <text class="lbl" x="262" y="136">SOC</text>
  </g>
  <g id="edge-ha-esp">
    <title>Home Assistant và ESP32 nói chuyện qua Wi-Fi, API có mã hoá</title>
    <path class="data" d="M578 145H712" marker-start="url(#ah-violet)" marker-end="url(#ah-violet)"/>
    <text class="lbl" x="584" y="136">Wi-Fi · API mã hoá</text>
    <text class="s" x="584" y="168">SOC ↔ chế độ</text>
  </g>

  <!-- Hàng 2: nuôi ESP32 và điều khiển -->
  <g id="blk-or">
    <title>Hai diode Schottky D1, D2 gộp hai nguồn để ESP32 luôn có điện</title>
    <rect class="card" x="40" y="300" width="200" height="70" rx="12"/>
    <text class="h" x="56" y="330">D1, D2 Schottky</text>
    <text class="s" x="56" y="354">nuôi ESP từ cả 2 nguồn</text>
  </g>
  <g id="blk-buck">
    <title>Mạch hạ áp 12V xuống 5V cho chân VIN của ESP32</title>
    <rect class="card" x="330" y="300" width="240" height="70" rx="12"/>
    <text class="h" x="346" y="330">Buck 12V → 5V</text>
    <text class="s" x="346" y="354">MP1584 / Mini-360</text>
  </g>
  <g id="blk-d4184">
    <title>Module MOSFET D4184 đóng ngắt cuộn hút relay theo GPIO16</title>
    <rect class="card" x="770" y="300" width="200" height="70" rx="12"/>
    <text class="h" x="786" y="330">Module D4184</text>
    <text class="s" x="786" y="354">MOSFET đóng cuộn hút</text>
  </g>
  <g id="edge-or-buck">
    <title>12V sau diode vào mạch hạ áp</title>
    <path class="p12t" d="M240 335H322" marker-end="url(#ah-amber)"/>
  </g>
  <g id="edge-buck-esp">
    <title>5V từ mạch hạ áp vào chân VIN của ESP32</title>
    <path class="p5" d="M570 335H640V214H712" marker-end="url(#ah-green)"/>
    <text class="lbl" x="650" y="290">5V → VIN</text>
  </g>
  <g id="edge-esp-d4184">
    <title>GPIO16 mức 3.3V điều khiển chân TRIG của module D4184</title>
    <path class="sig" d="M870 252V292" marker-end="url(#ah-sky)"/>
    <text class="lbl" x="880" y="278">GPIO16 (3.3V)</text>
  </g>

  <!-- Hàng 3: công suất -->
  <g id="blk-adp">
    <title>Adaptor 12V từ điện lưới</title>
    <rect class="card" x="40" y="450" width="200" height="70" rx="12"/>
    <text class="h" x="56" y="480">Adaptor 12V</text>
    <text class="s" x="56" y="504">điện lưới AC → DC</text>
  </g>
  <g id="blk-pin">
    <title>Nguồn Pin 12V. Chưa rõ lấy thẳng hay qua DC-DC từ pin 24V: cần chủ xác nhận</title>
    <rect class="card" x="40" y="590" width="200" height="70" rx="12"/>
    <text class="h" x="56" y="620">Nguồn Pin 12V</text>
    <text class="s" x="56" y="644">từ pin 24V qua DC-DC?</text>
  </g>
  <g id="blk-f2">
    <title>Cầu chì F2 nhánh Adaptor, chọn theo dòng tải</title>
    <rect class="card" x="330" y="470" width="70" height="30" rx="6"/>
    <text class="mono" x="352" y="490">F2</text>
  </g>
  <g id="blk-f1">
    <title>Cầu chì F1 nhánh Pin, chọn theo dòng tải</title>
    <rect class="card" x="330" y="610" width="70" height="30" rx="6"/>
    <text class="mono" x="353" y="630">F1</text>
  </g>
  <g id="edge-adp-or">
    <title>Adaptor nuôi ESP32 qua D2</title>
    <path class="p12t" d="M140 450V378" marker-end="url(#ah-amber)"/>
  </g>
  <g id="edge-pin-or">
    <title>Pin nuôi ESP32 qua D1</title>
    <path class="p12t" d="M40 625H22V335H32" marker-end="url(#ah-amber)"/>
  </g>
  <g id="edge-adp-relay">
    <title>Adaptor qua F2 vào tiếp điểm thường hở 87 (NO) của relay</title>
    <path class="p12" d="M240 485H330M400 485H560V575H744" marker-end="url(#ah-amber)"/>
    <text class="lbl" x="616" y="566">87 · NO</text>
  </g>
  <g id="edge-pin-relay">
    <title>Pin qua F1 vào tiếp điểm thường đóng 87a (NC) của relay</title>
    <path class="p12" d="M240 625H330M400 625H580V655H744" marker-end="url(#ah-amber)"/>
    <text class="lbl" x="616" y="646">87a · NC</text>
  </g>
  <g id="edge-coil-supply">
    <title>Nguồn cuộn hút lấy từ Adaptor sau F2: mất điện lưới thì relay tự nhả về Pin</title>
    <path class="coil" d="M450 485V400H740V345H762" marker-end="url(#ah-rose)"/>
    <text class="lbl" x="470" y="392">nguồn cuộn hút → DC+</text>
  </g>

  <g id="blk-relay">
    <title>Relay SPDT 12V 40A (rơ-le ô tô 5 chân). Không có điện cuộn hút thì COM nối NC = dùng Pin</title>
    <rect class="card-hot" x="720" y="430" width="300" height="260" rx="14"/>
    <rect class="card" x="815" y="446" width="110" height="30" rx="6"/>
    <text class="mono" x="836" y="466">cuộn 85/86</text>
    <text class="h" x="740" y="512">Relay SPDT 12V 40A</text>
    <text class="s" x="740" y="534">rơ-le ô tô 5 chân</text>
    <circle class="dot" cx="760" cy="575" r="6"/>
    <circle class="dot" cx="760" cy="655" r="6"/>
    <circle class="dot" cx="960" cy="615" r="7"/>
    <line class="arm-alt" x1="960" y1="615" x2="772" y2="578"/>
    <line class="arm" x1="960" y1="615" x2="772" y2="652"/>
    <text class="lbl" x="930" y="652">30 · COM</text>
  </g>
  <g id="edge-d4184-coil">
    <title>Module D4184 đóng mạch cuộn hút 85/86</title>
    <path class="sig" d="M870 370V438" marker-end="url(#ah-sky)"/>
  </g>
  <g id="blk-load">
    <title>Tải 12V nhận điện từ chân COM của relay</title>
    <rect class="card" x="1050" y="580" width="130" height="70" rx="12"/>
    <text class="h" x="1066" y="610">Tải 12V</text>
    <text class="s" x="1066" y="634">thiết bị 12V</text>
  </g>
  <g id="edge-relay-load">
    <title>COM của relay ra tải</title>
    <path class="p12" d="M968 615H1042" marker-end="url(#ah-amber)"/>
  </g>

  <text class="note" x="40" y="712">Âm (−) của Pin, Adaptor, tải và ESP32 nối chung · relay chỉ đóng cắt dây dương (+).</text>
  <text class="note" x="40" y="736">Cuộn hút không điện (ESP32 tắt, treo, hoặc mất Adaptor) → COM về NC → tải dùng Pin.</text>
</svg>
