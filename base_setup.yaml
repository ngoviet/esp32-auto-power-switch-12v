# Phần dùng chung: dịch vụ cốt lõi, Wi-Fi, chẩn đoán.
# Nạp vào tệp chính qua `packages:`; board và mạng Wi-Fi khai ở tệp chính.

esp32:
  framework:
    type: esp-idf

# ───────────────────────── Dịch vụ cốt lõi ─────────────────────────
api:
  # Không tự khởi động lại khi mất Home Assistant: logic relay vẫn chạy tại chỗ,
  # còn mỗi lần khởi động lại relay nhả ra một nhịp (GPIO thả nổi lúc boot).
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Trang web dự phòng để đổi chế độ khi Home Assistant không chạy.
web_server:
  port: 80

logger:
  baud_rate: 115200
  # INFO bỏ hẳn log DEBUG lúc biên dịch: firmware nhỏ hơn, ít tốn CPU.
  # Cần soi chi tiết thì tạm đổi sang DEBUG.
  level: INFO

wifi:
  # Nhà có nhiều AP cùng một SSID (Aruba T1/T2/T3): tắt fast_connect để ESP32
  # quét rồi chọn AP mạnh nhất, thay vì bám AP đầu tiên nó thấy.
  fast_connect: false
  power_save_mode: none
  # Không khởi động lại vì mất Wi-Fi: mạch vẫn giữ trạng thái relay, còn
  # khởi động lại chỉ làm relay nhả một nhịp. Wi-Fi tự kết nối lại.
  reboot_timeout: 0s

captive_portal:

# Lý do khởi động lại (bắt được sụt áp/brownout khi relay đóng cắt) và heap.
debug:
  update_interval: 60s

# ─────────────────────────── Cảm biến chẩn đoán ───────────────────────────
sensor:
  - platform: uptime
    id: uptime_sec
    internal: true # chỉ dùng để dựng chuỗi "Uptime" bên dưới
    update_interval: 60s

  - platform: debug
    free:
      name: "Heap Free"
      unit_of_measurement: "kB"
      accuracy_decimals: 0
      filters:
        - multiply: 0.0009765625 # byte → kB

  # 1) RSSI gốc (dBm) + làm mượt
  - platform: wifi_signal
    id: rssi_dbm
    name: "WiFi RSSI"
    update_interval: 30s
    entity_category: diagnostic
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  # 2) Quy đổi dBm → % chất lượng (0–100)
  - platform: template
    id: wifi_quality_pct
    name: "WiFi Quality"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: |-
      float rssi = id(rssi_dbm).state;
      if (std::isnan(rssi)) return NAN;
      if (rssi <= -100) return 0;
      if (rssi >= -50) return 100;
      return (rssi + 100.0f) * 2.0f;

text_sensor:
  - platform: template
    name: "Uptime"
    icon: mdi:clock-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (std::isnan(id(uptime_sec).state)) return {};
      unsigned t = (unsigned) id(uptime_sec).state;
      unsigned d = t / 86400, h = (t % 86400) / 3600, m = (t % 3600) / 60;
      char buf[24];
      if (d) snprintf(buf, sizeof(buf), "%ud %uh %um", d, h, m);
      else if (h) snprintf(buf, sizeof(buf), "%uh %um", h, m);
      else snprintf(buf, sizeof(buf), "%um", m);
      return std::string(buf);

  - platform: debug
    reset_reason:
      name: "Lý do khởi động lại"

  - platform: wifi_info
    ip_address:
      name: "WiFi IP"
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
    bssid:
      name: "WiFi BSSID" # biết đang bám AP Aruba nào
      entity_category: diagnostic
    mac_address:
      name: "WiFi MAC"
      entity_category: diagnostic

  # 3) Quy đổi dBm → số vạch "x/5"
  - platform: template
    id: wifi_bars
    name: "WiFi Bars"
    update_interval: 30s
    entity_category: diagnostic
    lambda: |-
      float rssi = id(rssi_dbm).state;
      if (std::isnan(rssi)) return {"N/A"};
      int bars = rssi >= -55 ? 5 : rssi >= -65 ? 4 : rssi >= -72 ? 3 : rssi >= -80 ? 2 : rssi >= -90 ? 1 : 0;
      char buf[8];
      snprintf(buf, sizeof(buf), "%d/5", bars);
      return {buf};

# ── Nút khởi động lại thủ công ─────────────────────────────────────────
button:
  - platform: restart
    id: restart_button
    name: "Restart thiết bị"
    entity_category: config
